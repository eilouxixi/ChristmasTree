<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Christmas Tree - Hand Interaction</title>
    <style>
        body { 
            margin: 0; overflow: hidden; background: radial-gradient(ellipse at center, #132d35, #030c14);
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; user-select: none;
        }

        /* 4:3 容器 */
        #canvas-wrapper {
            position: relative;
            box-shadow: 0 0 80px rgba(212, 175, 55, 0.15);
            background: #000;
            overflow: hidden;
            border-radius: 4px;
        }

        #canvas-container { width: 100%; height: 100%; display: block; }
        
        /* 摄像头窗口 */
        #video-container {
            position: absolute; top: 20px; right: 20px; width: 160px; height: 120px; z-index: 2;
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; overflow: hidden;
            transform: scaleX(-1); /* 镜像翻转 */
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            background: rgba(0,0,0,0.8);
            transition: opacity 0.5s ease;
        }
        #input-video { 
            width: 100%; height: 100%; object-fit: cover; opacity: 0.5; 
            position: absolute; top: 0; left: 0;
        }
        #skeleton-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
        }

        /* UI 层 */
        #ui-layer {
            position: absolute; top: 40px; left: 40px; z-index: 3; pointer-events: none;
            color: #fff; text-shadow: 0 2px 10px rgba(0,0,0,0.9);
            transition: opacity 0.5s;
        }

        h1 {
            font-weight: 200; letter-spacing: 6px; text-transform: uppercase; font-size: 2rem; margin: 0 0 15px 0;
            background: linear-gradient(to right, #fff, #ffd700, #fff); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .instructions {
            display: none;
            font-size: 0.85rem; color: #ccc; line-height: 1.8; max-width: 300px;
            background: rgba(10, 10, 10, 0.6); padding: 20px; border-radius: 12px;
            border-left: 2px solid #d4af37; backdrop-filter: blur(8px);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .highlight { color: #d4af37; font-weight: 600; padding: 0 4px; }
        #status-text { display: none; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #555; display: inline-block;}

        /* 按钮 */
        #upload-btn {
            pointer-events: auto; 
            background: rgba(255,255,255,0.1); 
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 12px 28px; cursor: pointer; text-transform: uppercase;
            font-size: 0.75rem; margin-top: 25px; transition: all 0.3s ease; 
            letter-spacing: 2px; border-radius: 30px;
        }
        #upload-btn:hover { background: #fff; color: #000; box-shadow: 0 0 25px rgba(255,255,255,0.4); }
        #file-input { display: none; }
        
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #d4af37; font-size: 1rem; letter-spacing: 4px; z-index: 10; 
            pointer-events: none; transition: opacity 0.5s; font-weight: 300;
        }

        /* 沉浸模式切换 */
        #fullscreen-btn {
            position: absolute; bottom: 30px; right: 30px; z-index: 20;
            background: rgba(0,0,0,0.3); color: #d4af37; border: 1px solid rgba(212, 175, 55, 0.3);
            width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.2rem; transition: all 0.3s;
            backdrop-filter: blur(4px);
        }
        #fullscreen-btn:hover { background: #d4af37; color: #000; border-color: #d4af37; }

        /* 隐藏 UI 状态 */
        .hide-ui #ui-layer, 
        .hide-ui #video-container { 
            opacity: 0; pointer-events: none; 
        }
        .hide-ui #fullscreen-btn { opacity: 0.5; }
        .hide-ui #fullscreen-btn:hover { opacity: 1; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="canvas-wrapper">
        <div id="canvas-container"></div>
        
        <div id="video-container">
            <video id="input-video" autoplay playsinline muted></video>
            <canvas id="skeleton-canvas"></canvas>
        </div>

        <button id="fullscreen-btn" onclick="toggleUI()" title="切换沉浸模式">⛶</button>

        <div id="ui-layer">
            <h1>Merry Christmas</h1>
            <div id="status-text"><span class="status-dot" id="status-dot"></span><span id="status-msg">初始化引擎...</span></div>
            <div class="instructions">
                • <span class="highlight">数字手势 1–9</span> : 显示本页对应照片（保持半秒）<br/>
                • <span class="highlight">1–4</span> : 从食指依次伸出，5 为五指张开<br/>
                • <span class="highlight">6</span> : 拇指＋小指；<span class="highlight">7</span> : 拇指＋食指＋中指<br/>
                • <span class="highlight">8</span> : 拇指＋食指呈 L；<span class="highlight">9</span> : 食指弯钩<br/>
                • <span class="highlight">5 指张开</span> : 仅散开；6–9 对应第 5–8 张<br/>
                • <span class="highlight">👍 / 👎</span> : 下一页 / 上一页（保持约 0.7 秒）<br/>
                • <span class="highlight">握拳</span> : 返回圣诞树<br/>
                • <span class="highlight">挥动</span> : 散开时旋转视图
                <div id="photo-page" style="margin-top:12px;color:#ffd700">上传照片后，伸出 数字手势 1–9查看</div>
                <div id="photo-list" style="font-size:0.75rem;line-height:1.5;color:#ddd"></div>
            </div>
            <button id="upload-btn" onclick="document.getElementById('file-input').click()">上传纪念照片</button>
            <input type="file" id="file-input" multiple accept="image/*">
        </div>
        <div id="loading">CRAFTING MAGIC...</div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { FilesetResolver, HandLandmarker } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0';

        // --- 全局配置 ---
        const CONFIG = {
            goldCount: 500,     
            silverCount: 500,   
            gemCount: 300,      
            emeraldCount: 300,  
            dustCount: 1000,    
            treeHeight: 75,
            maxRadius: 30,
            camDistance: 110,
            photoScatterRadius: 60,
            photoSurfaceGap: 4,
            bloomStrength: 0.22,
            bloomThreshold: 1.1,
            bloomRadius: 0.6,
            gesture: { emaTimeMs: 140, confirmMs: 500, pageMs: 650, maxGapMs: 250 }
        };

        const STATE = { TREE: 'tree', SCATTER: 'scatter', ZOOM: 'zoom' };
        let currentState = STATE.TREE;
        let targetState = STATE.TREE;
        
        // --- Three.js 变量 ---
        let scene, camera, renderer, composer;
        let mainGroup = new THREE.Group();
        let goldMesh, silverMesh, gemMesh, emeraldMesh, dustSystem;
        let photoMeshes = [];
        let zoomTargetIndex = -1;
        let photoPage = 0;
        let lastPalmTime = null;
        
        // --- 逻辑变量 ---
        let logicData = { gold: [], silver: [], gem: [], emerald: [], dust: [], star: null };
        const dummy = new THREE.Object3D();
        const _tempVec3 = new THREE.Vector3(); // 复用变量，减少GC
        const _tempEuler = new THREE.Euler();
        let time = 0;
        let christmasSnow;
        let lastSnowTime = null;
        
        // --- 交互变量 ---
        let handPos = { x: 0, y: 0 };
        let lastHandPos = { x: 0, y: 0 };
        let isHandPresent = false;
        let rotationVelocity = { x: 0, y: 0 }; // 物理惯性

        // BEGIN NUMBER GESTURES
        function classifyHand(points) {
            const distance = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, (a.z || 0) - (b.z || 0));
            const angle = (a, b, c) => {
                const u = [a.x-b.x, a.y-b.y, (a.z||0)-(b.z||0)];
                const v = [c.x-b.x, c.y-b.y, (c.z||0)-(b.z||0)];
                const length = Math.hypot(...u) * Math.hypot(...v);
                return length ? Math.acos(Math.max(-1, Math.min(1, u.reduce((sum, x, i) => sum+x*v[i], 0)/length))) * 180 / Math.PI : 0;
            };
            const scale = distance(points[0], points[9]);
            if (scale < 0.025) return null;
            const fingers = [5, 9, 13, 17].map(base =>
                angle(points[base], points[base+1], points[base+3]) > 155 &&
                distance(points[base+3], points[0]) > distance(points[base+1], points[0]) + scale * 0.15);
            const thumb = angle(points[2], points[3], points[4]) > 150 && distance(points[4], points[5]) > scale * 0.65;
            const pattern = fingers.map(Number).join('');
            // 中文数字 7：拇指、食指、中指聚拢；无需另做捏合确认。
            const gatheredSeven = !fingers[2] && !fingers[3] &&
                distance(points[4], points[8]) < scale * 0.45 && distance(points[8], points[12]) < scale * 0.45 &&
                Math.min(distance(points[8], points[0]), distance(points[12], points[0])) >
                    Math.max(distance(points[16], points[0]), distance(points[20], points[0])) + scale * 0.25;
            if (gatheredSeven) return '7';
            if (pattern === '0001' && thumb) return '6';
            if (pattern === '1000' && thumb) return '8';
            if (pattern === '1100' && thumb) return '7';
            // 中文数字 9：仅食指弯成钩，其余手指收起。
            const indexAngle = angle(points[5], points[6], points[8]);
            if (!thumb && !fingers[1] && !fingers[2] && !fingers[3] && indexAngle > 55 && indexAngle < 150 &&
                distance(points[6], points[0]) > distance(points[5], points[0]) + scale * 0.25) return '9';
            if (pattern === '0000') {
                if (!thumb) return 'fist';
                const dy = points[4].y - points[2].y;
                const dx = points[4].x - points[2].x;
                if (Math.abs(dy) > scale * 0.45 && Math.abs(dy) > Math.abs(dx)) return dy < 0 ? 'next' : 'previous';
                return null;
            }
            if (pattern === '1000' && !thumb) return '1';
            if (pattern === '1100' && !thumb) return '2';
            if (pattern === '1110' && !thumb) return '3';
            if (pattern === '1111') return thumb ? '5' : '4';
            return null;
        }

        class NumberGestureGate {
            constructor(config) { this.config = config; this.lastAction = null; this.reset(); }
            reset() { this.pending = null; this.since = null; this.lastTime = null; this.releaseSince = null; }
            update(key, now) {
                if (this.lastTime !== null && now - this.lastTime > this.config.maxGapMs) this.reset();
                this.lastTime = now;
                if (!key) {
                    this.pending = null; this.since = null;
                    if (this.releaseSince === null) this.releaseSince = now;
                    if (now - this.releaseSince >= 250) this.lastAction = null;
                    return null;
                }
                this.releaseSince = null;
                if (key !== this.pending) { this.pending = key; this.since = now; return null; }
                const duration = key === 'next' || key === 'previous' ? this.config.pageMs : this.config.confirmMs;
                if (now - this.since < duration || key === this.lastAction) return null;
                this.lastAction = key;
                return key;
            }
        }

        function resolvePhotoNumber(page, number, count) {
            const slot = number <= 4 ? number : number - 1;
            const index = page * 8 + slot - 1;
            return number >= 1 && number <= 9 && number !== 5 && index < count ? index : -1;
        }
        // END NUMBER GESTURES
        const numberGesture = new NumberGestureGate(CONFIG.gesture);

        function updatePhotoPage() {
            const pages = Math.max(1, Math.ceil(photoMeshes.length / 8));
            document.getElementById('photo-page').textContent = photoMeshes.length
                ? '第 ' + (photoPage + 1) + ' / ' + pages + ' 页 · 本页 ' + Math.min(8, photoMeshes.length - photoPage * 8) + ' 张 · 共 ' + photoMeshes.length + ' 张'
                : '上传照片后，伸出 数字手势 1–9查看';
            const list = document.getElementById('photo-list');
            list.replaceChildren();
            photoMeshes.slice(photoPage * 8, photoPage * 8 + 8).forEach((mesh, slot) => {
                const row = document.createElement('div');
                row.textContent = (slot + 1) + ' · ' + mesh.userData.fileName;
                row.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
                list.appendChild(row);
            });
        }

        // --- UI 控制 ---
        window.toggleUI = function() {
            document.getElementById('canvas-wrapper').classList.toggle('hide-ui');
        };

        function updateStatus(msg, color = '#fff') {
            document.getElementById('status-msg').innerHTML = msg;
            document.getElementById('status-dot').style.background = color;
        }

        // --- 初始化场景 ---
        function initThree() {
            const wrapper = document.getElementById('canvas-wrapper');
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0b202c, 0.0015);
            createChristmasBackdrop();

            updateDimensions(); // 计算初始尺寸

            camera = new THREE.PerspectiveCamera(50, wrapper.clientWidth / wrapper.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, CONFIG.camDistance);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance", stencil: false });
            renderer.setSize(wrapper.clientWidth, wrapper.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // 限制DPR以优化性能
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 0.85;
            container.appendChild(renderer.domElement);

            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

            // 灯光系统
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);

            const spotLight = new THREE.SpotLight(0xffddaa, 100);
            spotLight.position.set(30, 80, 50);
            spotLight.angle = Math.PI / 4;
            spotLight.penumbra = 1;
            scene.add(spotLight);

            const blueLight = new THREE.PointLight(0x4488ff, 50, 200);
            blueLight.position.set(-40, -20, 40);
            scene.add(blueLight);
            
            // 后处理
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(wrapper.clientWidth, wrapper.clientHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = CONFIG.bloomThreshold;
            bloomPass.strength = CONFIG.bloomStrength;
            bloomPass.radius = CONFIG.bloomRadius;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            createMaterialsAndMeshes();
            createDust();
            createStarField();

            scene.add(mainGroup);
            window.addEventListener('resize', onWindowResize);
        }

        function updateDimensions() {
            const targetAspect = 4 / 3;
            const windowAspect = window.innerWidth / window.innerHeight;
            let width, height;

            if (windowAspect > targetAspect) {
                height = window.innerHeight;
                width = height * targetAspect;
            } else {
                width = window.innerWidth;
                height = width / targetAspect;
            }

            const wrapper = document.getElementById('canvas-wrapper');
            wrapper.style.width = width + 'px';
            wrapper.style.height = height + 'px';
            return { width, height };
        }

        function createMaterialsAndMeshes() {
            // 使用 MeshPhysicalMaterial 获得更好的金属质感
            const goldMat = new THREE.MeshPhysicalMaterial({
                color: 0xffaa00, metalness: 1.0, roughness: 0.15, clearcoat: 1.0, emissive: 0xaa5500, emissiveIntensity: 0.1
            });
            const silverMat = new THREE.MeshPhysicalMaterial({
                color: 0xffffff, metalness: 0.9, roughness: 0.2, clearcoat: 1.0
            });
            const gemMat = new THREE.MeshPhysicalMaterial({
                color: 0xff0044, metalness: 0.1, roughness: 0.0, transmission: 0.6, thickness: 1.5, emissive: 0x550011, emissiveIntensity: 0.4
            });
            const emeraldMat = new THREE.MeshPhysicalMaterial({
                color: 0x00aa55, metalness: 0.2, roughness: 0.1, transmission: 0.5, thickness: 1.5, emissive: 0x002211, emissiveIntensity: 0.3
            });

            goldMesh = createInstancedMesh(new THREE.SphereGeometry(0.7, 12, 12), goldMat, CONFIG.goldCount, logicData.gold);
            silverMesh = createInstancedMesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), silverMat, CONFIG.silverCount, logicData.silver);
            gemMesh = createInstancedMesh(new THREE.OctahedronGeometry(0.8, 0), gemMat, CONFIG.gemCount, logicData.gem);
            emeraldMesh = createInstancedMesh(new THREE.ConeGeometry(0.5, 1.2, 6), emeraldMat, CONFIG.emeraldCount, logicData.emerald);

            // 树顶之星
            const starGeo = new THREE.OctahedronGeometry(3.0, 0);
            const starMat = new THREE.MeshPhysicalMaterial({ 
                color: 0xffffff, metalness:0.8, roughness:0, emissive:0xffffee, emissiveIntensity:0.6
            });
            const star = new THREE.Mesh(starGeo, starMat);
            star.userData = { 
                treePos: new THREE.Vector3(0, CONFIG.treeHeight/2 + 2.5, 0), 
                scatterPos: new THREE.Vector3(0, 60, 0) 
            };
            star.position.copy(star.userData.treePos);
            mainGroup.add(star);
            logicData.star = star;
        }

        function createInstancedMesh(geo, mat, count, dataArray) {
            const mesh = new THREE.InstancedMesh(geo, mat, count);
            mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            mainGroup.add(mesh);
            
            // 预生成每个粒子的逻辑数据
            for (let i = 0; i < count; i++) {
                const h = Math.random() * CONFIG.treeHeight - CONFIG.treeHeight/2;
                const normH = (h + CONFIG.treeHeight/2) / CONFIG.treeHeight;
                // 树形：下宽上窄
                const rMax = CONFIG.maxRadius * (1 - normH) * 1.1; 
                
                const r = Math.sqrt(Math.random()) * rMax; 
                const theta = Math.random() * Math.PI * 2;
                
                const treePos = new THREE.Vector3(r * Math.cos(theta), h, r * Math.sin(theta));
                // 散开：球形分布
                const scatterPos = randomSpherePoint(40 + Math.random()*50);

                dataArray.push({
                    treePos: treePos,
                    scatterPos: scatterPos,
                    currentPos: treePos.clone(),
                    scale: 0.5 + Math.random() * 0.9,
                    // 存储独立的旋转速度
                    rotSpeed: new THREE.Euler(Math.random()*0.02, Math.random()*0.02, 0),
                    rotation: new THREE.Euler(Math.random()*Math.PI, Math.random()*Math.PI, 0)
                });
            }
            return mesh;
        }

        function randomSpherePoint(r) {
            const u = Math.random(), v = Math.random();
            const theta = 2 * Math.PI * u;
            const phi = Math.acos(2 * v - 1);
            return new THREE.Vector3(
                r * Math.sin(phi) * Math.cos(theta), 
                r * Math.sin(phi) * Math.sin(theta), 
                r * Math.cos(phi)
            );
        }

        function createDust() {
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(CONFIG.dustCount * 3);
            
            for(let i=0; i<CONFIG.dustCount; i++) {
                const h = Math.random() * CONFIG.treeHeight - CONFIG.treeHeight/2;
                const r = Math.random() * CONFIG.maxRadius + 5;
                const theta = Math.random() * Math.PI * 2;
                
                const x = r*Math.cos(theta);
                const z = r*Math.sin(theta);
                
                pos[i*3] = x; pos[i*3+1] = h; pos[i*3+2] = z;
                
                logicData.dust.push({
                    treePos: new THREE.Vector3(x, h, z),
                    scatterPos: randomSpherePoint(70),
                    currentPos: new THREE.Vector3(x, h, z),
                    velocity: Math.random() * 0.05 + 0.02
                });
            }
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            
            const mat = new THREE.PointsMaterial({ 
                color: 0xffd700, size: 0.5, transparent: true, opacity: 0.4, 
                blending: THREE.AdditiveBlending, depthWrite: false 
            });
            dustSystem = new THREE.Points(geo, mat);
            mainGroup.add(dustSystem);
        }

        function createStarField() {
            const geo = new THREE.BufferGeometry();
            const pos = [];
            for(let i=0; i<800; i++) {
                pos.push((Math.random()-0.5)*800, (Math.random()-0.5)*800, (Math.random()-0.5)*800);
            }
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            const stars = new THREE.Points(geo, new THREE.PointsMaterial({color: 0x666666, size: 1.0, transparent: true, opacity: 0.6}));
            scene.add(stars);
        }

        function createChristmasBackdrop() {
            // 一张本地绘制的背景纹理，无需额外下载，避免影响摄像头和照片加载。
            const canvas = document.createElement('canvas');
            canvas.width = 1600; canvas.height = 1200;
            const ctx = canvas.getContext('2d');
            const sky = ctx.createLinearGradient(0, 0, 0, 1200);
            sky.addColorStop(0, '#030d20');
            sky.addColorStop(0.55, '#102d3b');
            sky.addColorStop(1, '#244743');
            ctx.fillStyle = sky; ctx.fillRect(0, 0, 1600, 1200);
            const glow = ctx.createRadialGradient(800, 600, 20, 800, 600, 700);
            glow.addColorStop(0, 'rgba(55,111,103,0.20)');
            glow.addColorStop(1, 'rgba(5,15,28,0)');
            ctx.fillStyle = glow; ctx.fillRect(0, 0, 1600, 1200);
            for (let i = 0; i < 220; i++) {
                ctx.fillStyle = `rgba(207,225,232,${0.15 + Math.random()*0.35})`;
                ctx.beginPath(); ctx.arc(Math.random()*1600, Math.random()*1000, 0.5+Math.random(), 0, Math.PI*2); ctx.fill();
            }
            // 远处积雪松林，保持低对比，中央留给圣诞树和照片。
            for (let layer = 0; layer < 2; layer++) {
                for (let i = 0; i < 28; i++) {
                    const x = i*65-70+Math.random()*35;
                    const height = 90+Math.random()*140;
                    const bottom = 1120+layer*65;
                    ctx.fillStyle = layer ? '#0a222b' : '#1b3c46';
                    for (let branch = 0; branch < 3; branch++) {
                        const y = bottom-height+branch*height*0.23;
                        const width = height*(0.18+branch*0.06);
                        ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-width,y+height*0.55); ctx.lineTo(x+width,y+height*0.55); ctx.closePath(); ctx.fill();
                    }
                }
            }
            ctx.fillStyle = '#18323c';
            ctx.beginPath(); ctx.moveTo(0,1140); ctx.quadraticCurveTo(500,1080,900,1150); ctx.quadraticCurveTo(1300,1090,1600,1130); ctx.lineTo(1600,1200); ctx.lineTo(0,1200); ctx.fill();
            // 顶部垂挂灯串：暖金、酒红与松绿，光晕只留在画面边缘。
            ctx.lineWidth = 3; ctx.strokeStyle = '#203d39';
            ctx.beginPath(); ctx.moveTo(0,26); ctx.quadraticCurveTo(800,150,1600,26); ctx.stroke();
            for (let i = 0; i <= 26; i++) {
                const t = i/26, x = t*1600, y = 26+248*t*(1-t);
                const color = ['216,171,91','164,64,64','78,136,109'][i%3];
                const halo = ctx.createRadialGradient(x,y+13,0,x,y+13,28);
                halo.addColorStop(0,`rgba(${color},0.24)`); halo.addColorStop(1,`rgba(${color},0)`);
                ctx.fillStyle = halo; ctx.fillRect(x-28,y-15,56,56);
                ctx.strokeStyle = '#2b4940'; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+10); ctx.stroke();
                ctx.fillStyle = `rgb(${color})`; ctx.beginPath(); ctx.ellipse(x,y+14,4,7,0,0,Math.PI*2); ctx.fill();
            }
            const background = new THREE.CanvasTexture(canvas);
            background.colorSpace = THREE.SRGBColorSpace;
            scene.background = background;

            const dot = document.createElement('canvas'); dot.width = 32; dot.height = 32;
            const dc = dot.getContext('2d');
            const feather = dc.createRadialGradient(16,16,0,16,16,15);
            feather.addColorStop(0,'rgba(230,242,255,0.9)'); feather.addColorStop(0.25,'rgba(230,242,255,0.5)'); feather.addColorStop(1,'rgba(230,242,255,0)');
            dc.fillStyle = feather; dc.fillRect(0,0,32,32);
            const positions = new Float32Array(450*3);
            for (let i=0; i<450; i++) {
                positions[i*3] = (Math.random()-0.5)*380;
                positions[i*3+1] = (Math.random()-0.5)*300;
                positions[i*3+2] = -100-Math.random()*100;
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position',new THREE.BufferAttribute(positions,3));
            christmasSnow = new THREE.Points(geometry,new THREE.PointsMaterial({
                map: new THREE.CanvasTexture(dot), color:0xc8dbe5, size:1.5,
                transparent:true, opacity:0.5, depthWrite:false, fog:false
            }));
            scene.add(christmasSnow);
        }

        function updateChristmasSnow(now) {
            if (!christmasSnow) return;
            const dt = lastSnowTime === null ? 0 : Math.min((now-lastSnowTime)/1000,0.05);
            lastSnowTime = now;
            const positions = christmasSnow.geometry.attributes.position;
            for (let i=0; i<positions.count; i++) {
                let y = positions.getY(i)-dt*(3+i%5);
                let x = positions.getX(i)+dt*Math.sin(now*0.0003+i)*1.5;
                if (y < -150) y += 300;
                if (x > 190) x -= 380;
                if (x < -190) x += 380;
                positions.setXY(i,x,y);
            }
            positions.needsUpdate = true;
        }

        // --- 核心动画循环 ---
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;
            updateChristmasSnow(performance.now());

            // 1. 更新实例化网格
            updateMeshLogic(goldMesh, logicData.gold);
            updateMeshLogic(silverMesh, logicData.silver);
            updateMeshLogic(gemMesh, logicData.gem);
            updateMeshLogic(emeraldMesh, logicData.emerald);

            // 2. 更新粒子与照片
            updateDustLogic();
            updateCameraFraming();
            updatePhotoLogic();
            
            // 3. 更新树顶星
            if (logicData.star) {
                let target = currentState === STATE.TREE ? logicData.star.userData.treePos : logicData.star.userData.scatterPos;
                logicData.star.position.lerp(target, 0.05);
                logicData.star.rotation.y += 0.01;
            }

            // 4. 全局旋转与惯性处理
            handlePhysicsRotation();

            composer.render();
        }

        function handlePhysicsRotation() {
            if (currentState === STATE.ZOOM) {
                // 缩放模式下停止旋转，方便观看
                rotationVelocity.x *= 0.8;
                rotationVelocity.y *= 0.8;
            } else if (currentState === STATE.SCATTER) {
                if (isHandPresent) {
                    const deltaX = handPos.x - lastHandPos.x;
                    const deltaY = handPos.y - lastHandPos.y;
                    
                    // 增加灵敏度但限制最大速度
                    if (Math.abs(deltaX) > 0.001) rotationVelocity.y += deltaX * 0.2;
                    if (Math.abs(deltaY) > 0.001) rotationVelocity.x += deltaY * 0.1;
                    
                    lastHandPos.x = handPos.x;
                    lastHandPos.y = handPos.y;
                }
                
                // 应用速度
                mainGroup.rotation.y += rotationVelocity.y;
                mainGroup.rotation.x += rotationVelocity.x;
                
                // 阻尼效果
                rotationVelocity.y *= 0.95; 
                rotationVelocity.x *= 0.95; 
                
                // 回正 X 轴
                mainGroup.rotation.x *= 0.98; 
            } else {
                // 树形态自动旋转
                mainGroup.rotation.y += 0.004;
                mainGroup.rotation.x *= 0.95;
            }
        }

        function updateMeshLogic(mesh, dataArray) {
            const isZoom = currentState === STATE.ZOOM;
            const isTree = currentState === STATE.TREE;

            for (let i = 0; i < dataArray.length; i++) {
                const item = dataArray[i];
                let target = isTree ? item.treePos : item.scatterPos;
                if(isZoom) target = item.scatterPos; // 放大时背景保持散开

                // 散开时的呼吸效果
                if (!isTree) item.currentPos.y += Math.sin(time + i * 0.1) * 0.01;

                // 位置插值
                item.currentPos.lerp(target, 0.08);
                
                // 自转
                item.rotation.x += item.rotSpeed.x;
                item.rotation.y += item.rotSpeed.y;

                let s = item.scale;
                if(isZoom) s *= 0.5; // 聚焦时背景粒子变小，突出照片

                dummy.position.copy(item.currentPos);
                dummy.rotation.copy(item.rotation);
                dummy.scale.setScalar(s);
                dummy.updateMatrix();
                mesh.setMatrixAt(i, dummy.matrix);
            }
            mesh.instanceMatrix.needsUpdate = true;
        }

        function updateDustLogic() {
            const positions = dustSystem.geometry.attributes.position.array;
            const isTree = currentState === STATE.TREE;

            for(let i=0; i<logicData.dust.length; i++) {
                const item = logicData.dust[i];
                
                if (isTree) {
                    // 树形态：粒子向上流动并限制在圆锥内
                    item.currentPos.y += item.velocity;
                    if(item.currentPos.y > CONFIG.treeHeight/2) item.currentPos.y = -CONFIG.treeHeight/2;
                    
                    // 简单的圆柱限制，避免计算过于复杂
                    const rMax = CONFIG.maxRadius * (1 - (item.currentPos.y + CONFIG.treeHeight/2)/CONFIG.treeHeight) + 5;
                    const rCurr = Math.sqrt(item.currentPos.x**2 + item.currentPos.z**2);
                    if(rCurr > rMax) {
                        item.currentPos.x *= 0.95;
                        item.currentPos.z *= 0.95;
                    }
                } else {
                    // 散开形态：飞向随机点
                    item.currentPos.lerp(item.scatterPos, 0.05);
                }

                positions[i*3] = item.currentPos.x;
                positions[i*3+1] = item.currentPos.y;
                positions[i*3+2] = item.currentPos.z;
            }
            dustSystem.geometry.attributes.position.needsUpdate = true;
        }

        function getCameraDistance() {
            const verticalHalfFov = THREE.MathUtils.degToRad(camera.fov / 2);
            const horizontalHalfFov = Math.atan(Math.tan(verticalHalfFov) * camera.aspect);
            const halfFov = Math.min(verticalHalfFov, horizontalHalfFov);
            const margin = 1.08;
            // 包含照片的宽高及边框，而非仅让照片中心进入视野。
            if (currentState === STATE.TREE) {
                const halfWidth = CONFIG.maxRadius * 1.1 + CONFIG.photoSurfaceGap + 4.2;
                const halfHeight = CONFIG.treeHeight / 2 + 4.2;
                const depth = CONFIG.maxRadius * 1.1 + CONFIG.photoSurfaceGap;
                return Math.max(CONFIG.camDistance, depth + margin * Math.max(
                    halfHeight / Math.tan(verticalHalfFov), halfWidth / Math.tan(horizontalHalfFov)
                ));
            }
            // 散开后整个球体会随手势旋转，按包围球拟合视野。
            const radius = CONFIG.photoScatterRadius + Math.hypot(4.2, 4.2) * 3 / 2;
            return Math.max(CONFIG.camDistance, margin * radius / Math.sin(halfFov));
        }

        function updateCameraFraming() {
            const distance = getCameraDistance();
            // 向外立即容纳照片，回到树形态时平滑拉近。
            camera.position.z = distance > camera.position.z ? distance : THREE.MathUtils.lerp(camera.position.z, distance, 0.05);
            camera.updateMatrixWorld();
        }

        function updatePhotoLogic() {

            photoMeshes.forEach((mesh, idx) => {
                const highlighted = currentState === STATE.ZOOM && idx === zoomTargetIndex;
                mesh.children[0].material.emissive.setHex(highlighted ? 0xffb300 : 0x000000);
                mesh.children[0].material.emissiveIntensity = highlighted ? 0.18 : 0;
                let targetPos, targetScale = 2.0; 
                
                if (currentState === STATE.ZOOM && idx === zoomTargetIndex) {
                    // 相机朝向局部 -Z，放在镜头前方 30 单位。
                    const camFront = new THREE.Vector3(0, 0, -30);
                    camFront.applyMatrix4(camera.matrixWorld); // 世界空间
                    targetPos = mainGroup.worldToLocal(camFront); // 局部空间

                    targetScale = 5.0;
                    mesh.lookAt(camera.position); // 始终朝向相机
                } else {
                    targetPos = currentState === STATE.TREE ? mesh.userData.treePos : mesh.userData.scatterPos;
                    if(currentState !== STATE.TREE) mesh.position.y += Math.sin(time+idx)*0.02;
                    
                    // 非聚焦状态下，根据基础旋转+公转
                    if(currentState === STATE.SCATTER) targetScale = 3.0;

                    // 树底部的照片也始终以正面朝向镜头，避免侧面消失或背面被边框挡住。
                    mesh.lookAt(camera.position);
                }
                
                mesh.position.lerp(targetPos, 0.1);
                
                const currentScale = mesh.scale.x;
                const newScale = THREE.MathUtils.lerp(currentScale, targetScale, 0.1);
                mesh.scale.setScalar(newScale);
            });
        }

        // --- 交互系统 (MediaPipe) ---
        async function setupMediaPipe() {
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm");
                const handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO", numHands: 1
                });
                
                const video = document.getElementById("input-video");
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                video.addEventListener("loadeddata", () => {
                    document.getElementById('loading').style.display = 'none';
                    updateStatus("系统就绪，请伸手", "#0f0");
                    predictWebcam(handLandmarker, video);
                });
            } catch (error) {
                console.error(error);
                document.getElementById('loading').innerText = "Camera Access Denied";
                updateStatus("无法访问摄像头", "#f00");
            }
        }

        let lastVideoTime = -1;
        let lastPredictionTime = 0;
        const PREDICTION_INTERVAL = 50; // 限制手势检测频率 (ms) -> 20 FPS

        async function predictWebcam(handLandmarker, video) {
            const now = performance.now();
            
            // 节流：如果是同一帧或者时间间隔太短，跳过检测
            if (video.currentTime !== lastVideoTime && (now - lastPredictionTime > PREDICTION_INTERVAL)) {
                lastVideoTime = video.currentTime;
                lastPredictionTime = now;
                
                const result = handLandmarker.detectForVideo(video, now);
                drawAndProcess(video, result);
            }
            requestAnimationFrame(() => predictWebcam(handLandmarker, video));
        }
        
        function drawAndProcess(video, result) {
            const canvas = document.getElementById('skeleton-canvas');
            const ctx = canvas.getContext('2d');
            
            // 确保画布尺寸匹配
            if(canvas.width !== video.videoWidth) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
            }
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (result.landmarks && result.landmarks.length > 0) {
                const landmarks = result.landmarks[0];
                isHandPresent = true;
                drawSkeleton(ctx, landmarks, canvas.width, canvas.height);
                handleGesture(landmarks);
            } else {
                isHandPresent = false;
                numberGesture.update(null, performance.now());
                lastPalmTime = null;
                // 如果没有手，自动回复一点点转速
                if(currentState === STATE.SCATTER) {
                   // rotationVelocity.y = THREE.MathUtils.lerp(rotationVelocity.y, 0.002, 0.05);
                }
            }
        }

        function drawSkeleton(ctx, landmarks, w, h) {
            ctx.lineWidth = 3; ctx.strokeStyle = '#00ff88'; ctx.fillStyle = '#ff0044';
            const connections = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
            
            ctx.beginPath();
            for (let c of connections) {
                const s = landmarks[c[0]];
                const e = landmarks[c[1]];
                ctx.moveTo(s.x * w, s.y * h); ctx.lineTo(e.x * w, e.y * h);
            }
            ctx.stroke();
            
            // 关键点
            for(let p of landmarks) {
                ctx.beginPath(); ctx.arc(p.x * w, p.y * h, 3, 0, 2 * Math.PI); ctx.fill();
            }
        }

        function handleGesture(landmarks) {
            const now = performance.now();
            const raw = { x: 1 - (landmarks[0].x + landmarks[9].x) / 2, y: (landmarks[0].y + landmarks[9].y) / 2 };
            const fresh = lastPalmTime === null || now - lastPalmTime > CONFIG.gesture.maxGapMs;
            const alpha = fresh ? 1 : 1 - Math.exp(-(now-lastPalmTime) / CONFIG.gesture.emaTimeMs);
            handPos.x += alpha * (raw.x - handPos.x);
            handPos.y += alpha * (raw.y - handPos.y);
            if (fresh) Object.assign(lastHandPos, handPos);
            lastPalmTime = now;
            const key = classifyHand(landmarks);
            const action = numberGesture.update(key, now);
            if (!action) {
                if (key && key !== numberGesture.lastAction) {
                    const label = key === 'next' ? '下一页' : key === 'previous' ? '上一页' : key === 'fist' ? '返回圣诞树' : key === '5' ? '散开照片' : '本页照片 ' + (Number(key) > 5 ? Number(key)-1 : key);
                    updateStatus('识别到：' + label + ' · 保持手势', '#ffd700');
                }
                return;
            }
            if (action === '5') {
                currentState = STATE.SCATTER;
                zoomTargetIndex = -1;
                rotationVelocity.x = 0; rotationVelocity.y = 0;
                Object.assign(lastHandPos, handPos);
                updateStatus('五指张开：星云散开 · 挥手旋转', '#00aaff');
            } else if (action === 'fist') {
                currentState = STATE.TREE;
                zoomTargetIndex = -1;
                rotationVelocity.x = 0; rotationVelocity.y = 0;
                updateStatus('握拳：返回圣诞树 · 数字手势查看照片', '#0f0');
            } else if (action === 'next' || action === 'previous') {
                const pages = Math.max(1, Math.ceil(photoMeshes.length / 8));
                const next = Math.max(0, Math.min(pages-1, photoPage + (action === 'next' ? 1 : -1)));
                if (next === photoPage) {
                    updateStatus(action === 'next' ? '已经是最后一页' : '已经是第一页', '#aaa');
                } else {
                    photoPage = next;
                    currentState = STATE.SCATTER;
                    zoomTargetIndex = -1;
                    Object.assign(lastHandPos, handPos);
                    updateStatus('已翻页 · 伸出 数字手势 1–9查看本页照片', '#00aaff');
                }
                updatePhotoPage();
            } else {
                const index = resolvePhotoNumber(photoPage, Number(action), photoMeshes.length);
                if (index === -1) {
                    updateStatus(photoMeshes.length ? '本页没有第 ' + (Number(action) > 5 ? Number(action)-1 : action) + ' 张照片' : '请先上传照片', '#aaa');
                    return;
                }
                switchToZoom(index);
                updateStatus('正在展示：第 ' + (photoPage+1) + ' 页 / 照片 ' + (index % 8 + 1) + ' · 换数字切换，握拳返回', '#ffd700');
            }
        }

        function switchToZoom(index) {
            if (index < 0 || index >= photoMeshes.length) return;
            currentState = STATE.ZOOM;
            targetState = STATE.ZOOM;
            zoomTargetIndex = index;
        }

        function onWindowResize() {
            const dims = updateDimensions();
            camera.aspect = dims.width / dims.height;
            camera.updateProjectionMatrix();
            renderer.setSize(dims.width, dims.height);
            composer.setSize(dims.width, dims.height);
        }

        // --- 照片上传处理 ---
        let photoUploadQueue = Promise.resolve();
        document.getElementById('file-input').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            e.target.value = '';
            photoUploadQueue = photoUploadQueue.then(async () => {
                let failed = 0;
                // 顺序解码，照片编号不受异步加载速度影响。
                for (const file of files) {
                    const url = URL.createObjectURL(file);
                    try {
                        const img = new Image();
                        img.src = url;
                        await img.decode();
                        addPhotoMesh(img, file.name);
                    } catch (error) { failed++; console.error('无法加载照片', file.name, error); }
                    finally { URL.revokeObjectURL(url); }
                }
                numberGesture.lastAction = null;
                numberGesture.reset();
                updatePhotoPage();
                updateStatus('已加载 ' + photoMeshes.length + ' 张照片 · 伸出 数字手势 1–9查看' + (failed ? '（' + failed + ' 张加载失败）' : ''), '#fff');
            });
        });

        function addPhotoMesh(img, fileName) {
            const tex = new THREE.Texture(img);
            tex.needsUpdate = true;
            tex.colorSpace = THREE.SRGBColorSpace;
            
            // 保持比例
            let w = 4, h = 4;
            if(img.width > img.height) h = 4 * (img.height/img.width);
            else w = 4 * (img.width/img.height);

            const geo = new THREE.PlaneGeometry(w, h);
            const mat = new THREE.MeshBasicMaterial({ 
                map: tex, side: THREE.DoubleSide, toneMapped: false
            });
            const mesh = new THREE.Mesh(geo, mat);
            
            // 金色边框
            const frame = new THREE.Mesh(
                new THREE.BoxGeometry(w+0.2, h+0.2, 0.1), 
                new THREE.MeshPhysicalMaterial({color:0xffd700, roughness:0.2, metalness:1})
            );
            frame.position.z = -0.06;
            mesh.add(frame);

            // 随机分布
            const h_pos = (Math.random() - 0.5) * CONFIG.treeHeight;
            const normH = (h_pos + CONFIG.treeHeight/2) / CONFIG.treeHeight;
            const r = CONFIG.maxRadius * (1 - normH) * 1.1 + CONFIG.photoSurfaceGap;
            const theta = Math.random() * Math.PI * 2;
            
            const treePos = new THREE.Vector3(r * Math.cos(theta), h_pos, r * Math.sin(theta));
            const scatterPos = randomSpherePoint(CONFIG.photoScatterRadius);

            mesh.userData = { 
                fileName,
                treePos, 
                scatterPos, 
                baseRot: new THREE.Euler(0, theta + Math.PI/2, 0) // 面向外部
            };
            mesh.position.copy(treePos);
            mesh.lookAt(new THREE.Vector3(0, h_pos, 0)); // 树状态下初始朝向中心
            
            photoMeshes.push(mesh);
            mainGroup.add(mesh);
        }

        // 启动
        initThree();
        animate();
        setupMediaPipe();
    </script>
</body>
